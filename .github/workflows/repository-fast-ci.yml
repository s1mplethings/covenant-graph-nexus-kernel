name: Repository Fast CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Canonical version and focused repository contracts
        run: |
          python scripts/canonical_version_gate.py
          python -m pytest -q tests/test_source_identity.py tests/test_canonical_repo_publish.py tests/test_release_candidate_gate.py tests/test_external_executor_discovery.py tests/test_external_executor_integration.py tests/test_kernel_contract.py
