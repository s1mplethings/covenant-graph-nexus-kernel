name: Repository Fast CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Product direction gate
        run: python scripts/product_direction_gate.py
      - name: MVP tree/DAG contracts
        run: python -m pytest -q tests/test_product_direction_guard.py tests/test_capability_tree_mvp.py tests/component
      - name: Repository publication and version contracts
        run: |
          python scripts/canonical_version_gate.py
          python -m pytest -q tests/test_source_identity.py tests/test_canonical_repo_publish.py tests/test_release_candidate_gate.py
