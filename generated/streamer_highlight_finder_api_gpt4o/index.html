<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Highlight Finder</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .controls, .results, .manual-marker, .export {
      margin-bottom: 20px;
    }
    .results {
      border: 1px solid #ccc;
      padding: 10px;
    }
    .results-item {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Streamer Highlight Finder</h1>

  <!-- JSON File Import -->
  <div class="controls">
    <h2>Import JSON Data</h2>
    <input type="file" id="jsonFileInput" accept=".json">
    <textarea id="jsonTextarea" placeholder="Or paste JSON data here" rows="5" style="width: 100%;"></textarea>
    <button id="importButton">Import Data</button>
  </div>

  <!-- Filters -->
  <div class="controls">
    <h2>Filters</h2>
    <label>
      Streamer:
      <input type="text" id="filterStreamer">
    </label>
    <label>
      Game:
      <input type="text" id="filterGame">
    </label>
    <label>
      Category:
      <input type="text" id="filterCategory">
    </label>
    <label>
      Min Score:
      <input type="number" id="filterMinScore" step="1" min="0">
    </label>
    <button id="applyFiltersButton">Apply Filters</button>
  </div>

  <!-- Manual Marker -->
  <div class="manual-marker">
    <h2>Add Manual Marker</h2>
    <form id="manualMarkerForm">
      <label>
        Streamer:
        <input type="text" id="manualStreamer" required>
      </label>
      <label>
        Game:
        <input type="text" id="manualGame" required>
      </label>
      <label>
        Category:
        <input type="text" id="manualCategory" required>
      </label>
      <label>
        Timestamp:
        <input type="text" id="manualTimestamp" required>
      </label>
      <label>
        Score:
        <input type="number" id="manualScore" step="1" min="0" required>
      </label>
      <button type="submit">Add Marker</button>
    </form>
  </div>

  <!-- Export -->
  <div class="export">
    <h2>Export Filtered Results</h2>
    <button id="exportButton">Export as JSON</button>
  </div>

  <!-- Results -->
  <div class="results">
    <h2>Results</h2>
    <div id="resultsArea"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
