<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Highlight Analyzer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body class="app-shell">
  <header class="app-header">
    <h1>Streamer Highlight Analyzer</h1>
    <p>Import data, narrow candidates, inspect ranked highlights, add manual markers, and export your cut list.</p>
  </header>

  <main class="workspace-grid">
    <!-- Intake Panel -->
    <section class="intake-panel">
      <h2>Import Data</h2>
      <input type="file" id="file-input" accept=".json">
      <textarea id="json-textarea" placeholder="Paste JSON data here"></textarea>
      <button id="import-button">Import</button>
    </section>

    <!-- Filters Panel -->
    <section class="filters-panel">
      <h2>Filters</h2>
      <form id="filter-form">
        <label for="filterStreamer">Streamer:</label>
        <input type="text" id="filterStreamer" name="filterStreamer">

        <label for="filterGame">Game:</label>
        <input type="text" id="filterGame" name="filterGame">

        <label for="filterCategory">Category:</label>
        <input type="text" id="filterCategory" name="filterCategory">

        <label for="filterScore">Minimum Score:</label>
        <input type="number" id="filterScore" name="filterScore" min="0" step="1">

        <button type="submit">Apply Filters</button>
      </form>
    </section>

    <!-- Results Panel -->
    <section class="results-panel">
      <h2>Results</h2>
      <div id="records-container" class="records-container">
        <!-- Highlight cards will be dynamically rendered here -->
      </div>
    </section>

    <!-- Manual Marker Panel -->
    <section class="manual-panel">
      <h2>Add Manual Marker</h2>
      <form id="manual-form">
        <label for="manualStreamer">Streamer:</label>
        <input type="text" id="manualStreamer" name="streamer" required>

        <label for="manualGame">Game:</label>
        <input type="text" id="manualGame" name="game" required>

        <label for="manualCategory">Category:</label>
        <input type="text" id="manualCategory" name="category" required>

        <label for="manualTimestamp">Timestamp:</label>
        <input type="datetime-local" id="manualTimestamp" name="timestamp" required>

        <label for="manualTime">Time (HH:MM:SS):</label>
        <input type="text" id="manualTime" name="time" pattern="\\d{2}:\\d{2}:\\d{2}" required>

        <label for="manualIntensity">Intensity:</label>
        <input type="number" id="manualIntensity" name="intensity" min="0" step="1" required>

        <label for="manualChatRate">Chat Rate:</label>
        <input type="number" id="manualChatRate" name="chatRate" min="0" step="1" required>

        <label for="manualKeywords">Keywords (comma-separated):</label>
        <input type="text" id="manualKeywords" name="keywords">

        <label for="manualTitle">Title:</label>
        <input type="text" id="manualTitle" name="title" required>

        <label for="manualDescription">Description:</label>
        <textarea id="manualDescription" name="description" required></textarea>

        <button type="submit">Add Marker</button>
      </form>
    </section>
  </main>

  <!-- Status Strip -->
  <footer class="status-strip">
    <div id="status-summary">
      <!-- Status summary will be dynamically updated here -->
    </div>
    <div class="action-bar">
      <button id="export-button">Export Cut List</button>
    </div>
  </footer>
</body>
</html>
