<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Stream Highlight Detector</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Game Stream Highlight Detector</h1>
  </header>

  <main>
    <!-- Data Import Section -->
    <section>
      <h2>Import Data</h2>
      <input type="file" id="file-input" accept=".json">
      <textarea id="json-textarea" placeholder="Paste JSON data here"></textarea>
      <button id="import-button">Import</button>
    </section>

    <!-- Filter Section -->
    <section>
      <h2>Filters</h2>
      <form id="filter-form">
        <label for="filterStreamer">Streamer:</label>
        <input type="text" id="filterStreamer" name="filterStreamer">

        <label for="filterGame">Game:</label>
        <input type="text" id="filterGame" name="filterGame">

        <label for="filterCategory">Category:</label>
        <input type="text" id="filterCategory" name="filterCategory">

        <label for="filterScore">Minimum Score:</label>
        <input type="number" id="filterScore" name="filterScore" min="0" step="1">

        <button type="submit">Apply Filters</button>
      </form>
    </section>

    <!-- Manual Marker Section -->
    <section>
      <h2>Add Manual Highlight</h2>
      <form id="manual-form">
        <label for="manualStreamer">Streamer:</label>
        <input type="text" id="manualStreamer" name="streamer" required>

        <label for="manualGame">Game:</label>
        <input type="text" id="manualGame" name="game" required>

        <label for="manualCategory">Category:</label>
        <input type="text" id="manualCategory" name="category" required>

        <label for="manualTimestamp">Timestamp:</label>
        <input type="text" id="manualTimestamp" name="timestamp" required>

        <label for="manualTime">Time:</label>
        <input type="text" id="manualTime" name="time" required>

        <label for="manualIntensity">Intensity:</label>
        <input type="number" id="manualIntensity" name="intensity" min="0" step="1" required>

        <label for="manualChatRate">Chat Rate:</label>
        <input type="number" id="manualChatRate" name="chatRate" min="0" step="1" required>

        <label for="manualKeywords">Keywords (comma-separated):</label>
        <input type="text" id="manualKeywords" name="keywords" required>

        <label for="manualTitle">Title:</label>
        <input type="text" id="manualTitle" name="title" required>

        <label for="manualDescription">Description:</label>
        <textarea id="manualDescription" name="description" required></textarea>

        <button type="submit">Add Highlight</button>
      </form>
    </section>

    <!-- Export Section -->
    <section>
      <h2>Export Highlights</h2>
      <button id="export-button">Export Filtered Highlights</button>
    </section>

    <!-- Status Summary -->
    <section>
      <h2>Status Summary</h2>
      <div id="status-summary"></div>
    </section>

    <!-- Results Section -->
    <section>
      <h2>Results</h2>
      <div id="records-container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 Game Stream Highlight Detector</p>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
