<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Stream Highlight Identifier</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body class="app-shell">
  <header class="app-header">
    <h1>Game Stream Highlight Identifier</h1>
    <p>Import data, narrow candidates, inspect ranked highlights, add manual markers, export the cut list.</p>
  </header>
  <main class="workspace-grid">
    <!-- Intake Panel -->
    <section class="intake-panel">
      <h2>Import Data</h2>
      <input type="file" id="file-input" accept=".json">
      <textarea id="json-textarea" placeholder="Paste JSON data here"></textarea>
      <button id="import-button">Import</button>
    </section>

    <!-- Filters Panel -->
    <section class="filters-panel">
      <h2>Filter Highlights</h2>
      <form id="filter-form">
        <label for="filterStreamer">Streamer:</label>
        <input type="text" id="filterStreamer" name="filterStreamer">
        
        <label for="filterGame">Game:</label>
        <input type="text" id="filterGame" name="filterGame">
        
        <label for="filterCategory">Category:</label>
        <input type="text" id="filterCategory" name="filterCategory">
        
        <label for="filterScore">Minimum Score:</label>
        <input type="number" id="filterScore" name="filterScore" min="0">
        
        <button type="submit">Apply Filters</button>
      </form>
    </section>

    <!-- Results Panel -->
    <section class="results-panel">
      <h2>Ranked Highlights</h2>
      <div id="records-container" class="records-container">
        <!-- Highlight cards will be dynamically rendered here -->
      </div>
    </section>

    <!-- Manual Marker Panel -->
    <section class="manual-panel">
      <h2>Add Manual Marker</h2>
      <form id="manual-form">
        <label for="streamer">Streamer:</label>
        <input type="text" id="streamer" name="streamer" required>
        
        <label for="game">Game:</label>
        <input type="text" id="game" name="game" required>
        
        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required>
        
        <label for="timestamp">Timestamp:</label>
        <input type="text" id="timestamp" name="timestamp" required>
        
        <label for="time">Time:</label>
        <input type="text" id="time" name="time" required>
        
        <label for="intensity">Intensity:</label>
        <input type="number" id="intensity" name="intensity" required>
        
        <label for="chatRate">Chat Rate:</label>
        <input type="number" id="chatRate" name="chatRate" required>
        
        <label for="keywords">Keywords:</label>
        <input type="text" id="keywords" name="keywords" required>
        
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
        
        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>
        
        <button type="submit">Add Marker</button>
      </form>
    </section>

    <!-- Status Strip -->
    <section class="status-strip">
      <h2>Status</h2>
      <div id="status-summary" class="status-summary">
        <!-- Status summary will be dynamically updated -->
      </div>
    </section>

    <!-- Action Bar -->
    <section class="action-bar">
      <button id="export-button">Export Cut List</button>
    </section>
  </main>
</body>
</html>
