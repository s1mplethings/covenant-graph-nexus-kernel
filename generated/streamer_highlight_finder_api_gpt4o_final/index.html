<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Highlight Finder</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <h1>Streamer Highlight Finder</h1>

  <!-- JSON File Import -->
  <section>
    <h2>Import JSON Data</h2>
    <input type="file" id="file-input" accept=".json">
    <textarea id="json-textarea" placeholder="Or paste JSON data here"></textarea>
    <button id="import-button">Import</button>
  </section>

  <!-- Filters -->
  <section>
    <h2>Filters</h2>
    <form id="filter-form">
      <label for="filterStreamer">Streamer:</label>
      <input type="text" id="filterStreamer" name="filterStreamer">

      <label for="filterGame">Game:</label>
      <input type="text" id="filterGame" name="filterGame">

      <label for="filterCategory">Category:</label>
      <input type="text" id="filterCategory" name="filterCategory">

      <label for="filterScore">Minimum Score:</label>
      <input type="number" id="filterScore" name="filterScore" step="0.1">

      <button type="submit">Apply Filters</button>
    </form>
  </section>

  <!-- Manual Marker Form -->
  <section>
    <h2>Add Manual Marker</h2>
    <form id="manual-form">
      <label for="streamer">Streamer:</label>
      <input type="text" id="streamer" name="streamer" required>

      <label for="game">Game:</label>
      <input type="text" id="game" name="game" required>

      <label for="category">Category:</label>
      <input type="text" id="category" name="category" required>

      <label for="timestamp">Timestamp:</label>
      <input type="text" id="timestamp" name="timestamp" required>

      <label for="intensity">Intensity:</label>
      <input type="number" id="intensity" name="intensity" step="0.1" required>

      <label for="chatRate">Chat Rate:</label>
      <input type="number" id="chatRate" name="chatRate" step="0.1" required>

      <label for="keywords">Keywords:</label>
      <input type="text" id="keywords" name="keywords" required>

      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required>

      <label for="description">Description:</label>
      <textarea id="description" name="description" required></textarea>

      <button type="submit">Add Marker</button>
    </form>
  </section>

  <!-- Export Button -->
  <section>
    <h2>Export Results</h2>
    <button id="export-button">Export Filtered Results</button>
  </section>

  <!-- Results Area -->
  <section>
    <h2>Results</h2>
    <div id="records-container"></div>
  </section>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
