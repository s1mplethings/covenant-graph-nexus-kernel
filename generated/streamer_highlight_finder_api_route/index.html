<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Highlight Finder</title>
    <link rel="icon" href="data:,">
    <style>
        body { font-family: Arial, sans-serif; }
        #results { margin-top: 20px; }
        .highlight { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Game Highlight Finder</h1>
    <input type="file" id="fileInput" accept="application/json">
    <div>
        <label for="filterStreamer">Streamer:</label>
        <input type="text" id="filterStreamer">
        <label for="filterGame">Game:</label>
        <input type="text" id="filterGame">
        <label for="filterScore">Min Score:</label>
        <input type="number" id="filterScore">
        <button id="filterButton">Filter</button>
    </div>
    <div>
        <h2>Add Manual Marker</h2>
        <input type="text" id="markerTitle" placeholder="Title">
        <input type="text" id="markerDescription" placeholder="Description">
        <button id="addMarkerButton">Add Marker</button>
    </div>
    <div id="results"></div>
    <button id="exportButton">Export Highlights</button>
    <script src="app.js"></script>
</body>
</html>
