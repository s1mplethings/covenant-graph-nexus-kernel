<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <title>Streamer Highlight Tool</title>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <h1>Streamer Highlight Tool</h1>
            <p>A tool designed for game streamers and content creators to automatically identify highlight segments from a single video file.</p>
        </header>
        <div class="workspace-grid">
            <div class="intake-panel">
                <h2>Import Data</h2>
                <input type="file" id="file-input" accept="video/*">
                <textarea id="json-textarea" placeholder="Paste JSON data here..."></textarea>
                <button id="import-button">Import</button>
            </div>
            <div class="filters-panel">
                <h2>Filters</h2>
                <form id="filter-form">
                    <label for="filterStreamer">Streamer:</label>
                    <input type="text" id="filterStreamer" name="streamer">
                    <label for="filterGame">Game:</label>
                    <input type="text" id="filterGame" name="game">
                    <label for="filterCategory">Category:</label>
                    <input type="text" id="filterCategory" name="category">
                    <label for="filterScore">Min Score:</label>
                    <input type="number" id="filterScore" name="score">
                </form>
            </div>
            <div class="results-panel">
                <h2>Results</h2>
                <div id="records-container"></div>
            </div>
            <div class="manual-panel">
                <h2>Add Manual Marker</h2>
                <form id="manual-form">
                    <label for="streamer">Streamer:</label>
                    <input type="text" id="streamer" name="streamer" required>
                    <label for="game">Game:</label>
                    <input type="text" id="game" name="game" required>
                    <label for="category">Category:</label>
                    <input type="text" id="category" name="category" required>
                    <label for="timestamp">Timestamp:</label>
                    <input type="text" id="timestamp" name="timestamp" required>
                    <label for="time">Time:</label>
                    <input type="text" id="time" name="time" required>
                    <label for="intensity">Intensity:</label>
                    <input type="text" id="intensity" name="intensity" required>
                    <label for="chatRate">Chat Rate:</label>
                    <input type="text" id="chatRate" name="chatRate" required>
                    <label for="keywords">Keywords:</label>
                    <input type="text" id="keywords" name="keywords" required>
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" required></textarea>
                    <button type="submit">Add Marker</button>
                </form>
            </div>
        </div>
        <div class="status-strip">
            <div id="status-summary">Status: Ready</div>
        </div>
        <div class="action-bar">
            <button id="export-button">Export Cut List</button>
        </div>
    </div>
    <script type="module" src="src/app.js"></script>
</body>
</html>
