[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgkn-agent-kit"
version = "0.2.0rc5"
description = "Project-agnostic Agent supervision companion for the CGNK Provider mainline"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "CGNK contributors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/s1mplethings/covenant-graph-nexus-kernel"

[project.scripts]
cgkn-agent = "cgkn_agent_kit.cli:main"

[tool.setuptools.package-data]
cgkn_agent_kit = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
