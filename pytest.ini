[pytest]
addopts = -p no:pytest-qt -p no:opik -p no:langsmith_plugin -p no:dash -p no:anyio
testpaths =
    tests
    scripts
python_files = test_*.py
markers =
    quick: stable fast tests for normal verification
    slow: slow tests that should not run in quick profile
    longrun: long-running scenario tests
    long_journey: long-running customer journey scenario tests
    provider: tests requiring a real provider/API or provider readiness
    live_provider: tests that call an external provider or network
    codex: tests covering Codex conversation orchestration and delivery flows
    e2e: end-to-end tests
    benchmark: benchmark or long-run validation tests
    integration: cross-module integration tests that may be slower than unit tests
