[pytest]
addopts = -p no:pytest-qt -p no:opik -p no:langsmith_plugin -p no:dash -p no:anyio
testpaths =
    tests
    scripts
python_files = test_*.py
markers =
    happy_path: expected successful behavior
    negative: rejected invalid or failed behavior
    boundary: limit or interface-boundary behavior
    roundtrip: serialization or persistence round trip
    property: fixed-seed property or invariant test
    determinism: stable ordering, hashing, or replay
    fault_injection: injected failure behavior
    recovery: retry, resume, or affected-only recovery
    security: authority, path, secret, command, or effect confinement
    local_functional: real local filesystem, subprocess, or test execution
    historical_asset: requires intentionally retired historical assets
    external_asset: requires an external or private asset
    stress: stress test outside kernel closure
    soak: soak test outside kernel closure
    quick: stable fast tests for normal verification
    slow: slow tests that should not run in quick profile
    longrun: long-running scenario tests
    long_journey: long-running customer journey scenario tests
    provider: tests requiring a real provider/API or provider readiness
    live_provider: tests that call an external provider or network
    codex: tests covering Codex conversation orchestration and delivery flows
    e2e: end-to-end tests
    benchmark: benchmark or long-run validation tests
    integration: cross-module integration tests that may be slower than unit tests
    application: L6 application-layer contract tests
    generation: software-project generation tests
    hidden_acceptance: isolated external acceptance harness tests
    real_generation: tests that call real Providers to generate projects
    real_repair: tests that call real Providers to repair a project
