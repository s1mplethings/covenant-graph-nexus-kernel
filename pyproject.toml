[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant-graph-nexus-kernel"
version = "0.2.0rc3"
description = "Composable capability kernel for evidence-grounded agentic project work"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "CGNK contributors"}]
keywords = ["agents", "capability-routing", "evidence", "rag", "project-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
media = ["Pillow>=10"]
yaml = ["PyYAML>=6"]
browser = ["playwright>=1.40"]
test = ["pytest>=8", "psutil>=5.9", "pyflakes>=3"]

[project.urls]
Repository = "https://github.com/s1mplethings/covenant-graph-nexus-kernel"
Documentation = "https://github.com/s1mplethings/covenant-graph-nexus-kernel/tree/main/docs"
Issues = "https://github.com/s1mplethings/covenant-graph-nexus-kernel/issues"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["cgkn*", "cgnk_knowledge*", "cgkn_project_management*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
